plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sev.atvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sev.atvhome'
        minSdk 30          // the TV runs Android 11 (API 30)
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
}
